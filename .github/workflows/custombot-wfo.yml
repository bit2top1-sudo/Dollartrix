name: CustomBot - wfo

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart-custombot-wfo]

# Concurrency guard — only one WFO bot at a time.
concurrency:
  group: custombot-wfo
  cancel-in-progress: true

jobs:
  run-custom-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout public scaffold
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: public

      - name: Clone private repo (Miadol)
        run: |
          git clone https://x-access-token:${{ secrets.FREQTRADE_CORE_PAT }}@github.com/${{ github.repository_owner }}/Miadol.git private

      # ── Restore OHLCV data from artifact ─────────────────────────────────
      # The data folder is ~700MB — too large for git. We persist it via
      # artifact instead. On first ever run the artifact won't exist yet and
      # WFO's auto-download will fetch whatever it needs during the run.
      - name: Restore OHLCV data artifact
        run: |
          DATA_DIR="private/freqtrade-core/user_data/data"
          mkdir -p "$DATA_DIR"

          ARTIFACT_NAME="wfo-ohlcv-data"
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}")
          ARTIFACT_ID=$( (echo "$RESPONSE" | grep -o '"id":[0-9]*' || true) | head -1 | (grep -o '[0-9]*' || true) )

          if [ -n "$ARTIFACT_ID" ]; then
            echo "Found OHLCV artifact ID: $ARTIFACT_ID — downloading..."
            HTTP_CODE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -L -w "%{http_code}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o /tmp/ohlcv_artifact.zip)
            if [ "$HTTP_CODE" = "200" ] && [ -s /tmp/ohlcv_artifact.zip ]; then
              # The artifact is a zip-of-a-zip: outer GitHub wrapper contains
              # our inner ohlcv_data.tar.gz which we extract into data/.
              unzip -o /tmp/ohlcv_artifact.zip -d /tmp/ohlcv_extracted || true
              if [ -f /tmp/ohlcv_extracted/ohlcv_data.tar.gz ]; then
                tar -xzf /tmp/ohlcv_extracted/ohlcv_data.tar.gz -C "$DATA_DIR"
                echo "OHLCV data restored ($(du -sh $DATA_DIR | cut -f1))."
              else
                echo "::warning::Artifact downloaded but ohlcv_data.tar.gz not found inside."
              fi
            else
              echo "::warning::OHLCV artifact download failed (HTTP $HTTP_CODE) — WFO will auto-download data as needed."
            fi
            rm -f /tmp/ohlcv_artifact.zip
          else
            echo "No OHLCV artifact found — first run or artifact expired. WFO will download data as needed."
          fi

      # ── Install full stack (Freqtrade + hyperopt + WFO deps) ─────────────
      # WFO calls freqtrade as a subprocess so it needs the full stack.
      # WFO's own Python deps (aiohttp, python-dotenv, numpy) are included
      # here directly — no separate requirements.txt step needed.
      - name: Install Freqtrade + hyperopt deps
        run: |
          pip install "freqtrade[hyperopt]" scipy numba bottleneck scikit-learn statsmodels \
            aiohttp python-dotenv numpy
          # TA-Lib: try prebuilt wheel first; fall back to building from source.
          pip install ta-lib 2>/dev/null || (
            sudo apt-get install -y build-essential wget &&
            wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz &&
            tar -xzf ta-lib-0.4.0-src.tar.gz &&
            cd ta-lib && ./configure --prefix=/usr && make -j2 && sudo make install && cd .. &&
            pip install ta-lib
          )

      # ── Install Ollama (local Auto Research providers) ────────────────────
      # ubuntu-latest does not ship Ollama. Needed for the two selectable
      # local AR providers (🖥️ Local: Qwen Coder 7B/14B) — see
      # ollama_local.py's start_ollama_server(), called from handlers.py's
      # main() right after Telegram starts. Unconditional (not gated
      # behind a flag/Variable, unlike Miaie's cloudflared install) since
      # these two providers are meant to be available out of the box, the
      # same way the rest of Auto Research's cloud providers are — a
      # local model just doesn't need a pasted key to become usable.
      # Official install script; a few seconds of install time on every
      # run either way.
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # ── Main run loop ─────────────────────────────────────────────────────
      - name: Run WFO for ~5h50m, commit state every 5min, then handoff
        env:
          BOT_NAME: "wfo"
          META_BOT_GITHUB_PAT: ${{ secrets.META_BOT_GITHUB_PAT }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          cd private
          git config user.email "wfo@local"
          git config user.name "WFO Bot"

          WFO_DIR="freqtrade-core/user_data/custom_bots/Wfo"
          USER_DATA="freqtrade-core/user_data"

          # ── Sync-and-commit helper (FIX: replaces silently-swallowed
          # `git pull --rebase -q || true` / `git push -q || true`) ─────────
          # Previously, the mid-loop commit every 5 minutes could fail
          # SILENTLY at either the pre-commit pull-rebase step or the
          # post-commit push step (both piped to `|| true`, discarding the
          # actual error). Under any real git contention on the private
          # repo — plausible any time meta-bot, another custom bot, or this
          # bot's own previous run is also writing to it — this meant a
          # whole 5-minute interval's worth of WFO progress could commit
          # only to this runner's LOCAL clone and never actually reach
          # GitHub, with no error visible anywhere. The next restart clones
          # fresh from origin/main and never sees that work: from Mia's
          # side, this looked exactly like "WFO doesn't keep its state
          # across restarts," even though state.py's own load/save logic
          # was fine the whole time — the bug was here, in the transport
          # loop wrapping it.
          #
          # This function: stages the same paths as before, retries
          # pull-rebase + commit + push as a unit up to 5 times with a
          # short backoff, and — critically — LOGS LOUDLY (::error::, so it
          # shows up flagged in the Actions run summary, not buried in
          # scrolling output) if all retries are exhausted, instead of
          # continuing on in total silence. It never hard-resets or
          # discards a local commit — if a push genuinely can't succeed
          # after 5 tries, the local commit is left in place (so nothing
          # already-committed is lost) and the loop continues; the NEXT
          # 5-minute cycle's pull-rebase will attempt to reconcile it, and
          # the final end-of-run commit is a last remaining safety net.
          sync_and_commit_wfo_state() {
            local commit_msg="$1"
            local attempt
            local _p

            # Stage each path as its OWN git add call, never one call with
            # many pathspecs at once. `git add p1 p2 p3 ...` is atomic — if
            # even ONE pathspec matches nothing (e.g. wfo_results/ doesn't
            # exist yet on a brand-new bot that hasn't produced any results
            # yet), the ENTIRE call fails and stages NOTHING AT ALL,
            # including adb30_state.json, which very much does exist and
            # very much has real changes worth saving. The old
            # `2>/dev/null || true` wrapping around the batched call masked
            # exactly this failure — confirmed via an isolated sandbox
            # repro before writing this version.
            for _p in \
              "${USER_DATA}/adb30_state.json" \
              "${USER_DATA}/wfo_results/" \
              "${USER_DATA}/hyperopt_results/" \
              "${USER_DATA}/wfo_masters/" \
              "${USER_DATA}/research/" \
              "${USER_DATA}/phoenix_calibration.json" \
              "${USER_DATA}/strategies/" \
              "${USER_DATA}/hyperopts/" \
              "${USER_DATA}/configs/" \
              "${WFO_DIR}/"
            do
              git add "$_p" 2>/dev/null || true
            done

            if git diff --cached --quiet; then
              # Nothing changed since last sync — not an error, just
              # nothing to push this cycle.
              return 0
            fi

            # Commit local changes BEFORE pulling — not after. WFO writes
            # adb30_state.json directly to disk every cycle without ever
            # staging or committing it itself, so by the time this
            # function runs the working tree already has unstaged
            # modifications to a TRACKED file. `git pull --rebase`
            # unconditionally refuses to run at all against unstaged
            # changes to a tracked file, regardless of whether there's an
            # actual upstream conflict — pulling before committing would
            # therefore fail EVERY single cycle, not just on real
            # contention. Committing first, then pulling --rebase (which
            # cleanly replays this commit on top of whatever was just
            # fetched), is the order that actually works — also confirmed
            # via the same sandbox repro, including the realistic
            # non-colliding concurrent-write case succeeding end to end.
            git commit -m "${commit_msg}" -q || true

            for attempt in 1 2 3 4 5; do
              if ! git pull --rebase -q; then
                echo "::warning::WFO state sync: git pull --rebase failed (attempt ${attempt}/5) — retrying."
                git rebase --abort >/dev/null 2>&1 || true
                sleep $((attempt * 3))
                continue
              fi

              if git push -q; then
                return 0
              fi

              echo "::warning::WFO state sync: git push failed (attempt ${attempt}/5) — will re-pull and retry."
              sleep $((attempt * 3))
            done

            # A genuine, unresolvable content conflict (two runs modifying
            # the SAME field of adb30_state.json in the same window) will
            # legitimately exhaust all 5 retries — no amount of retrying
            # fixes something git's line-based merge cannot resolve on its
            # own. This is the correct, honest failure mode: the commit
            # stays LOCAL (never discarded, never silently overwritten by
            # a force-push or hard-reset) and loudly flagged, rather than
            # either silently losing this run's work or silently
            # corrupting the shared state file. If this fires repeatedly
            # rather than as a one-off, it's worth checking whether two
            # things are genuinely racing on this exact bot's state file.
            echo "::error::WFO state sync FAILED after 5 attempts (${commit_msg}) — state is committed LOCALLY on this runner but has NOT reached GitHub. It will be retried next cycle; if this keeps happening, check for a genuine conflict (e.g. two workflows racing on the private repo) rather than a transient blip."
            return 1
          }


          # ── Verify WFO directory structure exists ──────────────────────────
          if [ ! -f "${WFO_DIR}/main.py" ]; then
            echo "❌ ERROR: WFO main.py not found at ${WFO_DIR}/main.py"
            ls -la "${WFO_DIR}/" || echo "Directory does not exist!"
            exit 1
          fi

          # ── Inject Telegram credentials ───────────────────────────────────
          # Titan WFO reads TITAN_BOT_TOKEN and TITAN_CHAT_ID from env.
          # These are stored as bot_token.txt and chat_id.txt in the private
          # repo (same pattern as all other custom bots), so they persist
          # across restarts without needing GitHub secrets per bot.
          # On first run: create these files manually in the private repo once.
          export TITAN_BOT_TOKEN=$(cat "${WFO_DIR}/bot_token.txt" 2>/dev/null || echo "")
          export TITAN_CHAT_ID=$(cat "${WFO_DIR}/chat_id.txt" 2>/dev/null || echo "")

          # Also export under all common aliases so any component that reads
          # a different env var name still gets the right value.
          export BOT_TOKEN="$TITAN_BOT_TOKEN"
          export TELEGRAM_BOT_TOKEN="$TITAN_BOT_TOKEN"
          export TG_TOKEN="$TITAN_BOT_TOKEN"
          export CHAT_ID="$TITAN_CHAT_ID"
          export TELEGRAM_CHAT_ID="$TITAN_CHAT_ID"
          export TG_CHAT_ID="$TITAN_CHAT_ID"

          # ── Point WFO at the shared user_data directory ───────────────────
          # config.py auto-detects environment. On GitHub Actions none of the
          # hardcoded paths (_DOCKER_DIR, _HOST_DIR, _PHONE_DIR) exist, so it
          # falls through to "local" mode using the directory containing the
          # script itself as base. We override with TITAN_USER_DIR to point it
          # at the shared freqtrade-core/user_data instead, so strategies,
          # configs, hyperopts, and results are all in the shared location.
          export TITAN_USER_DIR="$(pwd)/${USER_DATA}"

          # Clear the lock file from any previous run — it lives in /tmp on
          # GitHub runners which is ephemeral, but be explicit just in case.
          rm -f /tmp/adb30_wfo_commander.lock

          # ── Start WFO from parent directory (NOT from within Wfo/) ────────
          # FIX v31: Do NOT cd into WFO_DIR. Instead, set PYTHONPATH and run
          # with full path. This ensures main.py can import config, handlers,
          # etc. without import errors, and the working directory stays correct
          # for all relative path operations.
          export PYTHONPATH="${WFO_DIR}:${PYTHONPATH}"
          python3 "${WFO_DIR}/main.py" &
          WFO_PID=$!

          STOP_AFTER_SECONDS=$((5*3600 + 50*60))
          END_TIME=$(( $(date +%s) + STOP_AFTER_SECONDS ))

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            sleep 300

            if ! kill -0 "$WFO_PID" 2>/dev/null; then
              echo "WFO process exited unexpectedly — stopping early."
              # The python3 process that would normally send this via
              # self.tg.send is the very thing that just died -- send a
              # direct curl notice instead so this isn't only ever visible
              # in the Actions log. No auto-restart here (unlike Miaie's
              # bounded-restart loop) — per instruction, WFO should report
              # a crash and stay stopped so the workload can be reduced
              # manually before the next scheduled run picks it back up
              # (see the "Schedule next run" step at the end of this
              # workflow, which still fires normally either way).
              curl -s -X POST "https://api.telegram.org/bot${TITAN_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TITAN_CHAT_ID}" \
                -d "text=🔴 WFO's python3 process was killed at the OS level (likely OOM) and this job is stopping early rather than restarting. It will resume on its normal next-scheduled run -- check the Actions log, and consider reducing the workload (fewer active AR providers, a smaller local model, etc.) before then." \
                > /dev/null || true
              break
            fi

            # FIX: was `git pull --rebase -q || true` — a silent failure
            # here meant the control.json check right below could be
            # reading STALE local state (missing a restart request meta-bot
            # already pushed), with zero indication anything was wrong.
            if ! git pull --rebase -q; then
              echo "::warning::WFO: pre-check git pull --rebase failed — control.json read this cycle may be stale. Will retry via the sync function below regardless."
              git rebase --abort >/dev/null 2>&1 || true
            fi

            if [ -f "${WFO_DIR}/control.json" ] && grep -q '"restart_requested": *true' "${WFO_DIR}/control.json"; then
              echo "Early restart requested by meta-bot — stopping."
              break
            fi

            # Commit all WFO state and result files every 5 minutes, via
            # the retry-hardened helper defined above (see its own comment
            # for why this replaced the old silent add/commit/push).
            # This includes: adb30_state.json, wfo_results/, hyperopt_results/,
            # wfo_masters/, research/, phoenix_calibration.json.
            # Strategies and hyperopts in user_data/strategies/ and
            # user_data/hyperopts/ are also committed here so they're
            # immediately available to live bots on their next restart.
            sync_and_commit_wfo_state "autosave: wfo state - $(date -u)" || true
          done

          # ── Graceful shutdown ─────────────────────────────────────────────
          echo "Stopping WFO gracefully..."
          kill -TERM "$WFO_PID" 2>/dev/null || true
          wait "$WFO_PID" 2>/dev/null || true

          # ── Final state commit ────────────────────────────────────────────
          if [ -f "${WFO_DIR}/control.json" ]; then
            PAUSED=$(grep -o '"paused": *true' "${WFO_DIR}/control.json" || echo "")
          else
            PAUSED=""
          fi
          if [ -n "$PAUSED" ]; then
            echo '{"paused": true, "restart_requested": false}' > "${WFO_DIR}/control.json"
          else
            echo '{"paused": false, "restart_requested": false}' > "${WFO_DIR}/control.json"
          fi

          # Reuses the same hardened sync function as the mid-loop commits
          # above — this replaces what used to be a separate, slightly
          # weaker retry loop here (no rebase-abort recovery on a failed
          # pull, no check for "nothing actually changed"). Consistency
          # between the mid-loop and final commit paths matters: this is
          # the very last chance to get this run's work back to GitHub
          # before the runner's filesystem is discarded.
          if ! sync_and_commit_wfo_state "autosave: wfo final commit - $(date -u)"; then
            echo "::error::Final WFO commit FAILED after 5 attempts — state may not have persisted!"
          fi

      # ── Persist OHLCV data as artifact ───────────────────────────────────
      # Tar then upload. GitHub artifacts are always zipped by the action,
      # so we tar first to avoid zip-of-zip issues with large directory trees.
      - name: Upload OHLCV data artifact
        if: always()
        run: |
          DATA_DIR="private/freqtrade-core/user_data/data"
          if [ -d "$DATA_DIR" ] && [ "$(ls -A $DATA_DIR 2>/dev/null)" ]; then
            echo "Tarballing OHLCV data ($(du -sh $DATA_DIR | cut -f1))..."
            tar -czf /tmp/ohlcv_data.tar.gz -C "$DATA_DIR" .
            echo "Tarball size: $(du -sh /tmp/ohlcv_data.tar.gz | cut -f1)"
          else
            echo "No OHLCV data to upload."
            # Create empty tarball so the upload step always has a file
            tar -czf /tmp/ohlcv_data.tar.gz -T /dev/null 2>/dev/null || touch /tmp/ohlcv_data.tar.gz
          fi

      - name: Save OHLCV artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wfo-ohlcv-data
          path: /tmp/ohlcv_data.tar.gz
          overwrite: true
          retention-days: 90
          if-no-files-found: ignore

      # ── Schedule next run ─────────────────────────────────────────────────
      # Same meta_restart check as live bots — meta-bot is sole restart
      # authority when present; self-dispatch fires only as a fallback.
      - name: Schedule next run
        if: always()
        run: |
          cd private
          if ! git pull --rebase -q; then
            echo "::warning::Schedule-next-run: git pull --rebase failed — control.json read below may be stale."
            git rebase --abort >/dev/null 2>&1 || true
          fi
          WFO_DIR="freqtrade-core/user_data/custom_bots/Wfo"

          if [ -f "${WFO_DIR}/control.json" ] && grep -q '"paused": *true' "${WFO_DIR}/control.json"; then
            echo "WFO is paused — not scheduling next run."
            exit 0
          fi

          if [ -f "${WFO_DIR}/control.json" ] && grep -q '"meta_restart": *true' "${WFO_DIR}/control.json"; then
            echo "Meta-bot is handling this restart — skipping self-dispatch."
            exit 0
          fi

          echo "No meta-bot claim found — self-dispatching as fallback."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"restart-custombot-wfo"}'
          echo "Next WFO run triggered."
