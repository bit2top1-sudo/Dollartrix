name: CustomBot - trebble

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart-custombot-trebble, prime-custombot-trebble]

# Concurrency guard, split the same way meta-bot.yml is split, for the
# same reason: a primer dispatched to warm up this bot's successor must
# run in a SEPARATE group from the currently-live process, or GitHub's
# cancel-in-progress would kill the still-live process the instant the
# primer job starts (not once the primer is ready) — that single platform
# fact is why this can't just be "dispatch a second run into the same
# group and hope the timing works out."
concurrency:
  group: ${{ github.event.action == 'prime-custombot-trebble' && 'custombot-trebble-primer' || 'custombot-trebble' }}
  cancel-in-progress: true

jobs:
  run-custom-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # GitHub's hard cap for a single job — cannot be raised
    permissions:
      contents: write
      actions: write

    steps:
      - name: Clone private repo (Miadol)
        run: |
          git clone https://x-access-token:${{ secrets.FREQTRADE_CORE_PAT }}@github.com/${{ github.repository_owner }}/Miadol.git private

      - name: Install this bot's own dependencies
        run: |
          cd private/freqtrade-core/user_data/custom_bots/trebble
          pip install -r requirements.txt

      - name: Run bot for ~5h50m with zero-downtime handoff, commit its files every 5min
        env:
          BOT_NAME: "trebble"
          AUTOMATE_BOT_TOKEN: ${{ secrets.AUTOMATE_BOT_TOKEN }}
          AUTOMATE_ENCRYPTION_KEY: ${{ secrets.AUTOMATE_ENCRYPTION_KEY }}
          AUTOMATE_CHAT_ID: ${{ secrets.AUTOMATE_CHAT_ID }}
          META_BOT_GITHUB_PAT: ${{ secrets.META_BOT_GITHUB_PAT }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PUBLIC_REPO: ${{ github.event.repository.name }}
          HANDOFF_MODE: ${{ github.event.action == 'prime-custombot-trebble' && 'primer' || 'normal' }}
        run: |
          set -e
          cd private
          git config user.email "custombot@local"
          git config user.name "CustomBot ${BOT_NAME}"

          BOT_DIR="freqtrade-core/user_data/custom_bots/${BOT_NAME}"
          HANDOFF_FILE_PATH="freqtrade-core/user_data/handoff/${BOT_NAME}.json"
          THIS_INSTANCE_ID="$(python3 -c 'import uuid; print(uuid.uuid4().hex[:12])')"
          echo "This instance: ${THIS_INSTANCE_ID} (mode: ${HANDOFF_MODE})"

          # --- Small helpers for reading/writing the handoff file via the
          # GitHub Contents API directly (NOT via the local git clone —
          # this file changes on a fast cadence during a handoff window
          # and deserves its own narrow, independent transport rather than
          # contending with the bot's own periodic commit-and-push loop
          # below, which is already the single largest source of git
          # 409/rebase churn in this whole system).
          gh_get_handoff() {
            curl -s -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/Miadol/contents/${HANDOFF_FILE_PATH}"
          }

          gh_put_handoff() {
            # $1 = base64 JSON content, $2 = commit message. Re-fetches
            # SHA immediately before each attempt and retries on non-2xx,
            # same pattern as meta_bot.py's own gh_put_file — a handoff
            # write racing against another write (e.g. this same bot's
            # periodic autosave commit touching a totally different path)
            # must not be treated as fatal.
            local content_b64="$1"
            local message="$2"
            for attempt in 1 2 3; do
              sha=$(gh_get_handoff | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("sha","") if isinstance(d,dict) else "")' 2>/dev/null || echo "")
              if [ -n "$sha" ]; then
                body=$(python3 -c "import json,sys; print(json.dumps({'message': sys.argv[1], 'content': sys.argv[2], 'sha': sys.argv[3]}))" "$message" "$content_b64" "$sha")
              else
                body=$(python3 -c "import json,sys; print(json.dumps({'message': sys.argv[1], 'content': sys.argv[2]}))" "$message" "$content_b64")
              fi
              http_code=$(curl -s -o /tmp/gh_put_resp.json -w "%{http_code}" \
                -X PUT -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/Miadol/contents/${HANDOFF_FILE_PATH}" \
                -d "$body")
              if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            echo "::warning::gh_put_handoff failed after 3 attempts (http=$http_code) — handoff will fall back to normal budget-exhaustion restart."
            return 1
          }

          read_handoff_field() {
            # $1 = field name. Empty string if file/field missing. Kept
            # strictly single physical line (no embedded newline inside
            # the -c string) — a multi-line Python string embedded
            # directly in this YAML block scalar previously broke the
            # block's own indentation contract (any physical line that
            # dips to a shallower column than the block's established
            # indentation ends the block early) and produced a "mapping
            # values are not allowed here" / "could not find expected ':'"
            # YAML parse error the moment BOT_NAME got substituted in and
            # this became a real file. Semicolon-joined one-liners avoid
            # that failure mode entirely, confirmed by re-parsing the
            # fully-rendered file with PyYAML, not just eyeballing it.
            gh_get_handoff | python3 -c "import sys,json,base64; d=json.load(sys.stdin); h=json.loads(base64.b64decode(d['content']).decode()); print(h.get('$1','') or '')" 2>/dev/null || echo ""
          }

          write_handoff_json() {
            # $1 = fully-formed JSON string
            local b64
            b64=$(printf '%s' "$1" | base64 -w0)
            gh_put_handoff "$b64" "handoff: ${BOT_NAME} update"
          }

          # ==================================================================
          # PRIMER MODE: this job was dispatched specifically to warm up as
          # the successor. It's already done its slow setup (clone + pip
          # install, both prior steps). All that's left is to announce
          # readiness and BLOCK — never starting bot.py until it reads back
          # a "go" addressed to this exact THIS_INSTANCE_ID. The
          # instance_id scoping (not just a bare boolean) is what prevents
          # a stale/superseded primer from ever mistaking someone else's go
          # for its own.
          # ==================================================================
          if [ "$HANDOFF_MODE" = "primer" ]; then
            existing_primer_id=$(read_handoff_field primer_instance_id)
            existing_phase=$(read_handoff_field phase)
            if [ -n "$existing_primer_id" ] && [ "$existing_primer_id" != "$THIS_INSTANCE_ID" ] && [ "$existing_phase" != "idle" ] && [ -n "$existing_phase" ]; then
              echo "Handoff slot already claimed by ${existing_primer_id} (phase=${existing_phase}) — this primer is stale, exiting without serving."
              exit 0
            fi

            write_handoff_json "{\"phase\": \"ready\", \"primer_instance_id\": \"${THIS_INSTANCE_ID}\", \"go_ts\": null}"
            echo "Primer ready (${THIS_INSTANCE_ID}) — waiting for go signal..."

            DEADLINE=$(( $(date +%s) + 20*60 ))
            GOT_GO="false"
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              sleep 5
              cur_phase=$(read_handoff_field phase)
              cur_primer=$(read_handoff_field primer_instance_id)
              if [ "$cur_phase" = "go_sent" ] && [ "$cur_primer" = "$THIS_INSTANCE_ID" ]; then
                echo "Go signal confirmed for ${THIS_INSTANCE_ID} — taking over."
                GOT_GO="true"
                write_handoff_json "{\"phase\": \"idle\", \"primer_instance_id\": null, \"go_ts\": null}"
                break
              fi
              if [ "$cur_phase" = "idle" ]; then
                echo "Handoff slot was reset by the outgoing process — abandoning."
                exit 0
              fi
            done

            if [ "$GOT_GO" != "true" ]; then
              echo "No go signal within timeout — giving up. Outgoing process's own budget-exhaustion fallback covers continuity."
              exit 0
            fi
            # Falls through into normal serving below, AS the new instance.
          fi

          # Token and chat_id live in the private repo, same as exchange keys
          # do for the Freqtrade bots — never a GitHub secret, since secrets
          # can't be created per-bot dynamically without a separate API
          # call+encryption step. This is simpler and just as safe since
          # nothing here is reachable outside this one ephemeral runner.
          #
          # We export under EVERY common env var name that Telegram bot scripts
          # tend to use. This means any custom bot script works out of the box
          # regardless of what it calls its token var — no changes to the bot
          # script ever needed for credential wiring.
          #
          # IF A FUTURE CUSTOM BOT'S TELEGRAM ISN'T WORKING: check what env
          # var name it reads its token/chat_id from (grep for os.getenv or
          # os.environ in the script), then just add that name to this block.
          # Each runner job is fully isolated — no cross-bot contamination.
          _TOKEN=$(cat "${BOT_DIR}/bot_token.txt")
          _CHAT_ID=$(cat "${BOT_DIR}/chat_id.txt")
          # Token — all common names
          export BOT_TOKEN="$_TOKEN"
          export TELEGRAM_BOT_TOKEN="$_TOKEN"
          export TELEGRAM_TOKEN="$_TOKEN"
          export TITAN_BOT_TOKEN="$_TOKEN"
          export TG_TOKEN="$_TOKEN"
          export TG_BOT_TOKEN="$_TOKEN"
          # Chat ID — all common names
          export CHAT_ID="$_CHAT_ID"
          export TELEGRAM_CHAT_ID="$_CHAT_ID"
          export TITAN_CHAT_ID="$_CHAT_ID"
          export TG_CHAT_ID="$_CHAT_ID"

          # Arbitrary script — we genuinely don't know what it does or what
          # it names its own state/db files, unlike the Freqtrade bots where
          # we control the whole stack. Commit the WHOLE folder rather than
          # a specific filename, since that's the only thing that's actually
          # generic enough to work for any script.
          (cd "$BOT_DIR" && python3 bot.py) &
          BOT_PID=$!

          STOP_AFTER_SECONDS=$((5*3600 + 50*60))
          HANDOFF_MARGIN_SECONDS=$((15*60))
          END_TIME=$(( $(date +%s) + STOP_AFTER_SECONDS ))
          PRIMER_DISPATCHED="false"
          EXIT_SENTINEL="normal"

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            sleep 300
            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "Bot process exited unexpectedly — stopping early."
              break
            fi
            git pull --rebase -q || true
            if [ -f "${BOT_DIR}/control.json" ] && grep -q '"restart_requested": *true' "${BOT_DIR}/control.json"; then
              echo "Early restart requested by meta-bot — stopping after this cycle."
              break
            fi
            git add "$BOT_DIR"
            git commit -m "autosave: periodic - ${BOT_NAME} - $(date -u)" -q || true
            git push -q || true

            # --- Handoff: outgoing side, checked once per 5-min cycle ----
            # (Custom bots don't long-poll Telegram the way meta-bot does,
            # so there's no natural ~30s cadence to hook into — the
            # existing 5-min autosave loop is the right cadence here. The
            # gap this introduces is bounded by how close to END_TIME the
            # margin is set, not by this poll interval, since dispatch
            # happens as soon as we cross the margin on any 5-min tick.)
            _time_left=$(( END_TIME - $(date +%s) ))
            if [ "$PRIMER_DISPATCHED" = "false" ] && [ "$_time_left" -le "$HANDOFF_MARGIN_SECONDS" ]; then
              PRIMER_DISPATCHED="true"
              cur_phase=$(read_handoff_field phase)
              if [ -z "$cur_phase" ] || [ "$cur_phase" = "idle" ]; then
                write_handoff_json "{\"phase\": \"priming\", \"primer_instance_id\": null, \"go_ts\": null}"
                curl -s -X POST \
                  -H "Authorization: token ${META_BOT_GITHUB_PAT}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/${PUBLIC_REPO}/dispatches" \
                  -d "{\"event_type\":\"prime-custombot-${BOT_NAME}\"}"
                echo "Primer dispatched for ${BOT_NAME}."
              fi
            fi

            if [ "$PRIMER_DISPATCHED" = "true" ]; then
              cur_phase=$(read_handoff_field phase)
              cur_primer=$(read_handoff_field primer_instance_id)
              if [ "$cur_phase" = "ready" ] && [ -n "$cur_primer" ]; then
                echo "Primer ${cur_primer} is ready — yielding now."
                write_handoff_json "{\"phase\": \"go_sent\", \"primer_instance_id\": \"${cur_primer}\", \"go_ts\": true}"
                EXIT_SENTINEL="handoff_yielded"
                break
              fi
            fi
          done

          echo "Stopping ${BOT_NAME} gracefully..."
          kill -TERM "$BOT_PID" 2>/dev/null || true
          wait "$BOT_PID" 2>/dev/null || true

          git pull --rebase -q || true
          if [ -f "${BOT_DIR}/control.json" ]; then
            PAUSED=$(grep -o '"paused": *true' "${BOT_DIR}/control.json" || echo "")
          else
            PAUSED=""
          fi
          if [ -n "$PAUSED" ]; then
            echo '{"paused": true, "restart_requested": false}' > "${BOT_DIR}/control.json"
          else
            echo '{"paused": false, "restart_requested": false}' > "${BOT_DIR}/control.json"
          fi

          git add "$BOT_DIR"
          git commit -m "autosave: final commit before restart - ${BOT_NAME} - $(date -u)" -q || true
          PUSH_OK=false
          for attempt in 1 2 3 4 5; do
            if git push -q; then
              PUSH_OK=true
              break
            fi
            git pull --rebase -q || true
            sleep $((attempt * 2))
          done
          if [ "$PUSH_OK" = false ]; then
            echo "::error::Final commit for ${BOT_NAME} FAILED after 5 attempts — state may not have persisted!"
          fi

          echo "$EXIT_SENTINEL" > /tmp/custombot_exit_reason_${BOT_NAME}

      - name: Schedule next run (skipped on clean handoff — successor already live under a separate concurrency group)
        if: always()
        run: |
          cd private && git pull --rebase -q || true
          BOT_DIR="freqtrade-core/user_data/custom_bots/trebble"

          if [ -f "/tmp/custombot_exit_reason_trebble" ] && grep -q "handoff_yielded" "/tmp/custombot_exit_reason_trebble"; then
            echo "Clean handoff detected — successor already live under the '-primer' concurrency group. Skipping self-dispatch entirely (dispatching restart-custombot-trebble here would start a genuine competing third process, since the successor is NOT in this workflow's normal concurrency group)."
            exit 0
          fi

          if [ -f "${BOT_DIR}/control.json" ] && grep -q '"paused": *true' "${BOT_DIR}/control.json"; then
            echo "trebble is paused — not scheduling next run."
            exit 0
          fi

          if [ -f "${BOT_DIR}/control.json" ] && grep -q '"meta_restart": *true' "${BOT_DIR}/control.json"; then
            echo "Meta-bot is handling this restart — skipping self-dispatch."
            exit 0
          fi

          echo "No meta-bot claim found — self-dispatching as fallback."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"restart-custombot-trebble"}'
          echo "Next run of trebble triggered."
